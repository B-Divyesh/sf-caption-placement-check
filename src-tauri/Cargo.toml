[package]
name = "caption-placement-check"
version = "0.1.0"
description = "Local caption placement accessibility preflight"
authors = ["Sociobot"]
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-caption-placement-check"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "caption_placement_check_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
tauri = { version = "2.8.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
